plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.21"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def weblibreGoMobileAar = file("../../../../native/go_mobile_runtime/build/weblibre-go.aar")

android {
    namespace = "eu.weblibre.gecko"
    compileSdk = 37
    ndkVersion = rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "eu.weblibre.gecko"
        // https://api.flutter.dev/flutter/widgets/AndroidView-class.html
        minSdkVersion = 26
        targetSdk = 37
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // The pubspec build number. It rises on every published tag, alphas
        // included (D4), and is what the updater orders releases by. APK
        // version codes append an ABI digit to it (see abiCodes below).
        buildConfigField "int", "LOGICAL_RELEASE_SEQUENCE", "${flutterVersionCode.toInteger()}"
        // Whether the Flutter engine renders via Impeller or Skia. Read by
        // io.flutter.embedding.android.EnableImpeller in AndroidManifest.xml.
        // Skia is the default; comparison flavors override this below.
        //
        // enableHcpp is read by io.flutter.embedding.android.EnableHcpp and only
        // matters under Impeller on API 34+. On by default; pass
        // -PenableHcpp=false (flutter: --android-project-arg enableHcpp=false)
        // to build the other half of the #450 comparison.
        manifestPlaceholders = [
            enableImpeller: "false",
            enableHcpp: project.findProperty("enableHcpp") ?: "true",
        ]
    }

    // Two dimensions (plans/APP_UPDATER_IMPLEMENTATION_PLAN.md, D1/D3):
    //
    // - distribution: who delivers updates. `github` carries the self-updater
    //   (installer, apksig, the install permission), `play` the Play in-app
    //   update bridge, `fdroid` neither. Each has its own source set under
    //   src/<distribution>, so a variant only ever contains its own updater.
    // - track: release track and renderer, unchanged from before.
    //
    // Only the combinations below are built; androidComponents.beforeVariants
    // disables the rest.
    flavorDimensions "distribution", "track"
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"github"'
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"play"'
        }
        fdroid {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"fdroid"'
        }

        stable {
            dimension "track"
            manifestPlaceholders = [appName: "WebLibre", enableImpeller: "false"]
            buildConfigField "String", "TRACK", '"stable"'
            buildConfigField "String", "RENDERER", '"skia"'
        }
        stableImpeller {
            dimension "track"
            manifestPlaceholders = [appName: "WebLibre (Impeller)", enableImpeller: "true"]
            buildConfigField "String", "TRACK", '"stable"'
            buildConfigField "String", "RENDERER", '"impeller"'
        }
        alpha {
            dimension "track"
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            manifestPlaceholders = [appName: "WebLibre Alpha", enableImpeller: "false"]
            buildConfigField "String", "TRACK", '"alpha"'
            buildConfigField "String", "RENDERER", '"skia"'
        }
        alphaImpeller {
            dimension "track"
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            manifestPlaceholders = [appName: "WebLibre Alpha (Impeller)", enableImpeller: "true"]
            buildConfigField "String", "TRACK", '"alpha"'
            buildConfigField "String", "RENDERER", '"impeller"'
        }
    }

    sourceSets {
        // The Impeller comparison build shares the alpha launcher branding.
        alphaImpeller {
            res.srcDirs += 'src/alpha/res'
        }
    }

    dependencies {
        // implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        if (!weblibreGoMobileAar.exists()) {
            throw new GradleException(
                "Missing combined gomobile runtime AAR: ${weblibreGoMobileAar}. " +
                    "Run native/go_mobile_runtime/scripts/build-android.sh from the repository root."
            )
        }
        implementation files(weblibreGoMobileAar)
        // SearchBarWidgetProvider uses Glance directly. home_widget pins
        // glance-appwidget itself (1.2.0 as of home_widget 0.10.0, which needs
        // setWidgetPreviews), so keep this in step with it and never `strictly`:
        // a plain request lets Gradle take the higher of the two on its next bump.
        implementation 'androidx.glance:glance-appwidget:1.2.0'
        implementation 'com.google.android.material:material:1.14.0'

        // Reference APK verifier for the GitHub self-updater (D13). Pure Java;
        // kept in step with the Android Gradle Plugin, which ships the same
        // library. Never in Play or F-Droid variants.
        githubImplementation 'com.android.tools.build:apksig:9.4.1'

        // The updater bridge's generated Pigeon handlers run on coroutines.
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

        testImplementation 'junit:junit:4.13.2'
        // Android's org.json is a stub on the host JVM.
        testImplementation 'org.json:json:20260814'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests {
            // Host-side tests of the updater's pure logic; Android calls are
            // stubs that return defaults.
            returnDefaultValues = true
        }
    }

    signingConfigs {
        release {
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeFile System.getenv("KEY_PATH") ? file(System.getenv("KEY_PATH")) : null
            storePassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release

            shrinkResources = !project.hasProperty("disableOptimization")
            minifyEnabled = !project.hasProperty("disableOptimization")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release'] // Use on the "release" build type in dependencies (AARs)
        }
    }

    bundle {
        // Profiler issues require us to temporarily package native code compressed to
        // match the previous APK packaging.
        // https://bugzilla.mozilla.org/show_bug.cgi?id=1865634
        packagingOptions {
            jniLibs {
                it.useLegacyPackaging = true
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    //Exclude dependenciesInfo for f-droid
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// The supported distribution × track combinations. Everything else (a Play
// alpha, an F-Droid Impeller build, ...) is never built, so it can't be
// published by accident.
def supportedVariantFlavors = [
    "githubStable", "githubStableImpeller", "githubAlpha", "githubAlphaImpeller",
    "playStable", "fdroidStable",
] as Set

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        def flavors = variantBuilder.productFlavors.collectEntries { [(it.first): it.second] }
        def name = flavors["distribution"] + flavors["track"].capitalize()
        variantBuilder.enable = supportedVariantFlavors.contains(name)
    }
}

// The only file that names Play Core. F-Droid deletes it together with
// src/play in its prebuild, so the fdroid build never resolves it.
if (file("play.gradle").exists()) {
    apply from: "play.gradle"
}

apply from: "build_manifest.gradle"

//Override version code for f-droid
ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
  variant.outputs.each { output ->
    def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
    if (abiVersionCode != null) {
      output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
    }
  }
}
